spring.application.name=middaymeal

server.port=8080
server.servlet.context-path=/mdm

spring.datasource.url=jdbc:postgresql://localhost:5432/mdm_db
spring.datasource.username=mdm_user
spring.datasource.password=test123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true



spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml


spring.profiles.active=dev

logging.level.root=INFO
logging.level.org.liquibase=TRACE
logging.level.liquibase=DEBUG

#page default size
spring.data.web.pageable.default-page-size=1
spring.data.web.pageable.max-page-size=100


security.jwt.secret=mdm-super-secret-key-mdm-super-secret-key
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-days=14

security.password.encoder.strength=10

ai.service.base-url=http://localhost:8000
ai.service.analyze-endpoint=/ai/analyze
ai.service.timeout-ms=5000